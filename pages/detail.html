<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stock Photography | Detail</title>
  <meta name="theme-color" content="#0e0e0e"/>
  <link rel="preload" as="image" fetchpriority="high"
        href="../images/Photography/james-foulk-HJF7mZKscMs-unsplash.jpg"/>
  <link rel="stylesheet" href="../css/style.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <nav class="navbar">
    <a href="../index.html" class="logo">
      Stock Photography
    </a>
    <ul class="nav-links">
      <li><a href="../index.html">Home</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="login.html">Login</a></li>
      <li><a href="register.html">Register</a></li>
    </ul>
  </nav>

  <div class="detail-container">
    <div class="detail-image">
      <div id="sketchGallery">
        <img src="../images/Photography/james-foulk-HJF7mZKscMs-unsplash.jpg" alt="Photography preview" class="gallery-single" fetchpriority="high" width="1200" height="800" decoding="async"/>
      </div>
    </div>

    <div class="detail-info">
      <h1 id="sketchTitle">Stock Photography</h1>

      <div class="price-box">
        <p class="detail-price" id="sketchPrice">PKR 0</p>
        <p class="vuln-note">⚠️ VULN: Price from database, but frontend can be tampered (hidden field editable).</p>
      </div>

      <input type="hidden" id="finalPrice" value="0"/>
      <input type="hidden" id="sketchId" value="0"/>

      <div class="buy-form">
        <div class="form-group">
          <label>Your Full Name</label>
          <input type="text" id="buyerName" placeholder="Okasha Rajput"/>
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="text" id="buyerPhone" placeholder="03XX-XXXXXXX"/>
        </div>
        <div class="form-group">
          <label>Delivery Address</label>
          <input type="text" placeholder="Enter Your Email"/>
        </div>
        <div class="form-group">
          <label>Payment Method</label>
          <select id="payMethod">
            <option value="easypaisa">Easypaisa</option>
            <option value="jazzcash">JazzCash</option>
            <option value="bank">Bank Transfer</option>
            <option value="cod">Cash on Delivery</option>
          </select>
        </div>

        <button class="btn-buy" onclick="placeOrder()">
          Place Order — <span id="btnPrice">PKR 0</span>
        </button>

        <div id="orderResult" style="margin-top:16px;"></div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>© 2026 Stock Photography | Okasha Rajput</p>
  </footer>

<script src="../js/main.js" defer></script>
</body>
</html>
