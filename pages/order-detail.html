    <ul class="nav-links">
      <li><a href="../index.html">Home</a></li>

  <div class="dashboard-container" id="orderDetailContainer">
    <div class="dash-header">
      <h1>Order Details</h1>
      <p id="orderIdDisplay">Order #—</p>
    </div>

    <div class="dash-section">
      <h2>Order Information</h2>
      <div id="orderInfo" class="info-box">
        <p><strong>Buyer Name:</strong> <span id="detailBuyer">—</span></p>
        <p><strong>Phone:</strong> <span id="detailPhone">—</span></p>
        <p><strong>Address:</strong> <span id="detailAddress">—</span></p>
        <p><strong>Plan / Sketch:</strong> <span id="detailPlan">—</span></p>
        <p><strong>Amount:</strong> <span id="detailAmount">—</span></p>
        <p><strong>Payment Method:</strong> <span id="detailPayment">—</span></p>
        <p><strong>Status:</strong> <span id="detailStatus">—</span></p>
        <p><strong>Notes:</strong> <span id="detailNotes">—</span></p>
        <p><strong>Uploaded Photo:</strong> <span id="detailPhoto">—</span></p>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>© 2026 Stock Photography | Okasha Rajput</p>
  </footer>

  <script src="../js/main.js"></script>
