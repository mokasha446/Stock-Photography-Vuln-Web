<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Photography | Login</title>
  <meta name="theme-color" content="#0f172a" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

  <nav class="navbar">
    <a href="../index.html" class="logo">
      <img src="../images/Photography/brian-gomes-QKCvdSfVJT8-unsplash.jpg" alt="Romee Sketch logo" width="32" height="32" loading="eager" decoding="async"/>
      Stock Photography 
    </a>
    <ul class="nav-links">
      <li><a href="../index.html">Home</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="login.html">Login</a></li>
      <li><a href="register.html">Register</a></li>
    </ul>
  </nav>

  <div class="auth-page">
    <div class="auth-box">
      <h2>Welcome Back</h2>
      <p class="sub">Login to your Stock Photography account</p>

      <div class="form-group">
        <label>Email</label>
        <input type="text" id="lEmail" placeholder="your@email.com" onkeydown="if(event.key==='Enter') doLogin()" />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="lPass" placeholder="Your password" onkeydown="if(event.key==='Enter') doLogin()" />
      </div>

      <!-- VULN: No lockout after failed attempts -->
      <div class="vuln-note" style="margin-bottom:16px;">
        ⚠️ VULN: No brute force protection — unlimited login attempts allowed
      </div>

      <button class="btn-buy" onclick="doLogin()">Login</button>

      <div id="loginMsg" style="margin-top:16px;"></div>

      <p style="color:#888; margin-top:20px; text-align:center; font-size:0.9rem;">
        No account?
        <a href="register.html" style="color:#fff;">Register here</a>
      </p>

      <!-- VULN: Credentials visible in source -->
      <!-- test accounts: admin@okasha.com / admin123 | user@okasha.com / 1234 -->
    </div>
  </div>

  <footer class="footer">
    <p>© 2026 Stock Photography  | Okasha Rajput</p>
  </footer>

  <script src="../js/main.js" defer></script>
</body>

</html>
